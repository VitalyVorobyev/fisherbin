[project]
name = "scorequant"
version = "0.1.0"
description = "Information-preserving binning for statistical inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vitaly Vorobyev", email = "vit.vorobiev@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["binning", "fisher-information", "jax", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.7",
    "optax>=0.2",
]

[project.urls]
Documentation = "https://vitalyvorobyev.github.io/scorequant/"
Issues = "https://github.com/VitalyVorobyev/scorequant/issues"
Repository = "https://github.com/VitalyVorobyev/scorequant"

[project.optional-dependencies]
viz = ["matplotlib>=3.10"]
examples = [
    "ipykernel>=6.29",
    "matplotlib>=3.10",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pandas>=2.3,<4",
    "scikit-learn>=1.9,<2",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings>=1,<2",
    "mkdocstrings-python>=2,<3",
]
dev = [
    "hypothesis>=6.130",
    "ipykernel>=6.29",
    "matplotlib>=3.10",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "py-spy>=0.4.2",
    "pytest>=8.3",
    "pyyaml>=6",
    "ruff>=0.11",
    "ty>=0.0.70,<0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["agenticresearch"]

[tool.ruff.lint]
ignore = ["D105", "D107"]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "TID"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Use an explicit boundary or domain type instead." }

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["B018"]
"benchmarks/**" = ["D"]
"examples/**" = ["D"]
"tests/**" = ["D"]
