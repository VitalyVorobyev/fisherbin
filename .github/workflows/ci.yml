name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      JAX_ENABLE_X64: "1"
      MPLBACKEND: Agg
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev --locked
      - run: uv run pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv build

  float32-smoke:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "0"
      MPLBACKEND: Agg
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.13
      - run: uv sync --dev --locked
      - run: uv run pytest tests/test_float32.py

  benchmarks:
    needs: [quality, test]
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
      MPLBACKEND: Agg
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-extras --dev --locked
      # Quality is the strict cross-platform gate; baselines.json timings come
      # from a fixed local machine, and shared CI runners are slower and noisy,
      # so the wall-clock tolerance only catches order-of-magnitude blowups.
      - run: >
          uv run python benchmarks/bench.py --check benchmarks/baselines.json
          --time-tolerance 10 --quality-rtol 1e-6
