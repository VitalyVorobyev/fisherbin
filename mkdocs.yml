# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: ScoreQuant
site_description: Information-preserving binning for statistical inference
site_url: https://vitalyvorobyev.github.io/scorequant/
repo_url: https://github.com/VitalyVorobyev/scorequant
repo_name: VitalyVorobyev/scorequant
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Vitaly Vorobyev

exclude_docs: |
  development.md
  roadmap.md
  system-design.md
  adr/**

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Why ScoreQuant: motivation.md
  - Method overview: method.md
  - Three doors: three-doors.md
  - Choosing your workflow: user-workflow.md
  - Book:
      - Overview: book/index.md
      - Why bin at all: book/ch01-why-bin.md
      - One dimension by hand: book/ch02-one-dimension.md
      - Exact 1D binning by dynamic programming: book/ch03-exact-1d.md
      - Scores, score laws, and the three doors: book/ch04-scores-and-doors.md
      - Information after hard labels: book/ch05-information-after-binning.md
      - Two tasks and three optimization levels: book/ch06-two-tasks.md
      - The trace criterion and whitened k-means: book/ch07-trace-kmeans.md
      - D-optimality and exact exchange: book/ch08-d-optimality.md
      - Mahalanobis geometry and guarded Lloyd: book/ch09-mahalanobis-lloyd.md
      - Nuisance parameters and profiled Ds: book/ch10-profiled-ds.md
      - "E-optimality: why not": book/ch11-e-optimality.md
      - Soft rules, purification, and consistency: book/ch12-soft-rules.md
      - "Estimated scores: classifiers and calibration": book/ch13-estimated-scores.md
      - Diagnostics and choosing a method: book/ch14-choosing-a-method.md
  - Tutorials:
      - First analytic partition: tutorials/first-partition.md
      - Linear components: tutorials/linear-components.md
      - Classifier posteriors for mixtures: tutorials/classifier-mixtures.md
  - Evidence:
      - Synthetic gallery: gallery/index.md
      - FlowCyt study: usecases/cellpopulation.md
  - API:
      - API guide: api.md
      - Reference:
          - Overview: reference/index.md
          - Fitting: reference/fitting.md
          - Linear models: reference/models.md
          - Configuration: reference/configuration.md
          - Results: reference/results.md
          - Certificates: reference/certification.md
          - Information: reference/information.md
          - Transforms: reference/transforms.md
          - Visualization: reference/visualization.md
  - Related work: related-work.md
  - Glossary: glossary.md
  - Bibliography: bibliography.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
