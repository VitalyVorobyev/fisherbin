# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: ScoreQuant
site_description: Information-preserving binning for statistical inference
site_url: https://vitalyvorobyev.github.io/scorequant/
repo_url: https://github.com/VitalyVorobyev/scorequant
repo_name: VitalyVorobyev/scorequant
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Vitaly Vorobyev

exclude_docs: |
  development.md
  roadmap.md
  system-design.md
  adr/**
  motivation.md
  method.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Book:
      - Overview: book/index.md
      - Likelihood, score, and score law: book/01-likelihood-score-law.md
      - Probability and intensity scores: book/02-probability-intensity.md
      - Information after hard labels: book/03-hard-label-information.md
      - Three optimization levels: book/04-three-optimization-levels.md
      - Trace and weighted k-means: book/05-trace-kmeans.md
      - Population geometry: book/06-population-geometry.md
      - D-optimality: book/07-d-optimality.md
      - Profiled D-s: book/08-profiled-ds.md
      - E-optimality: book/09-e-optimality.md
      - Randomized rules and consistency: book/10-randomized-consistency.md
      - Exact and estimated scores: book/11-score-estimation.md
      - Diagnostics and method choice: book/12-diagnostics-choice.md
  - Tutorials:
      - First analytic partition: tutorials/first-partition.md
      - Linear components: tutorials/linear-components.md
      - Classifier posteriors for mixtures: tutorials/classifier-mixtures.md
  - Evidence:
      - Synthetic gallery: gallery/index.md
      - FlowCyt study: usecases/cellpopulation.md
  - How-to and API:
      - Workflow guide: user-workflow.md
      - Sources and providers: score-sources.md
      - API guide: api.md
      - Migration guide: migration.md
      - Reference:
          - Overview: reference/index.md
          - Fitting: reference/fitting.md
          - Linear models: reference/models.md
          - Configuration: reference/configuration.md
          - Results: reference/results.md
          - Information: reference/information.md
          - Transforms: reference/transforms.md
          - Visualization: reference/visualization.md
  - Glossary: glossary.md
  - Bibliography: bibliography.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
