# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: FisherBin
site_description: Information-preserving binning for statistical inference
site_url: https://vitalyvorobyev.github.io/fisherbin/
repo_url: https://github.com/VitalyVorobyev/fisherbin
repo_name: VitalyVorobyev/fisherbin
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Vitaly Vorobyev

exclude_docs: |
  development.md
  roadmap.md
  system-design.md
  adr/**
  motivation.md
  method.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Learn:
      - The estimation problem: learn/estimation-problem.md
      - Likelihood and score: learn/likelihood-and-score.md
      - Fisher information: learn/fisher-information.md
      - What binning loses: learn/binning-loss.md
      - Constructing scores: learn/score-construction.md
      - Algorithms: learn/algorithms.md
      - Diagnostics: learn/diagnostics.md
      - Limitations and alternatives: learn/limitations.md
  - Tutorials:
      - First analytic partition: tutorials/first-partition.md
      - Linear components: tutorials/linear-components.md
      - Classifier posteriors for mixtures: tutorials/classifier-mixtures.md
  - Evidence:
      - Synthetic gallery: gallery/index.md
      - FlowCyt study: usecases/cellpopulation.md
  - How-to and API:
      - Workflow guide: user-workflow.md
      - API guide: api.md
      - Reference:
          - Overview: reference/index.md
          - Fitting: reference/fitting.md
          - Linear models: reference/models.md
          - Configuration: reference/configuration.md
          - Results: reference/results.md
          - Information: reference/information.md
          - Transforms: reference/transforms.md
          - Visualization: reference/visualization.md
  - Glossary: glossary.md
  - Bibliography: bibliography.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
